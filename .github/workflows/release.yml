name: 发布

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v0.2.0（必须已经推到远端）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.mk.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - id: notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || {
            echo "::error::远端没有这个 tag：$TAG"; exit 1; }
          BODY="$(git tag -l --format='%(contents)' "$TAG")"
          [ -n "$BODY" ] || BODY="$(git log -1 --pretty=%B "$TAG")"
          {
            echo "body<<__EOF__"
            echo "$BODY"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@v7
        id: mk
        with:
          result-encoding: string
          script: |
            const tag = process.env.TAG
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `VinsEditor ${tag}`,
              body: process.env.NOTES || '',
              draft: true,
              prerelease: false,
            })
            return data.id
        env:
          TAG: ${{ inputs.tag }}
          NOTES: ${{ steps.notes.outputs.body }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - platform: windows-latest
            args: --bundles nsis
          - platform: macos-13
            args: --bundles dmg
          - platform: macos-14
            args: --bundles dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            rpm patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: true
