[package]
name = "mars-editor"
version = "0.1.2"
description = "VinsEditor —— Markdown 写作，一键转成公众号内联样式富文本"
authors = ["bryc3"]
license = "MIT"
repository = "https://github.com/whyubel1eve/Mars-Editor-APP"
homepage = "https://mars-editor.cc"
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mars_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-http = "2.5.9"
tauri-plugin-opener = "2.5.3"
tauri-plugin-process = "2.3.0"
base64 = "0.23.1"
notify = "8.2.0"
tauri-plugin-clipboard-manager = "2.3.2"

[dev-dependencies]
tempfile = "3.27.0"

# In-app update. Desktop only: there is no such thing as sideloading a new
# binary over yourself on iOS/Android, where the store owns that job.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.9.0"
